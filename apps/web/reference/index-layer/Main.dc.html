    <div style="margin-left: auto; display: flex; align-items: center; gap: 8px; flex-wrap: wrap">

        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8E8E96" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
        <label for="q" style="position: absolute; left: -9999px">Search the market</label>
        <input id="q" type="text" placeholder="Search ticker, name or contract address" style="flex: 1; min-width: 0; border: 0; background: transparent; color: #F2F2F3; font: 400 15px 'Inter', sans-serif; outline: none">
      </div>
    </div>

    <div style="overflow-x: auto; border-radius: 14px; border: 1px solid #1C1C20; background: #0E0E10">
      <div style="min-width: 960px">
        <div style="display: flex; align-items: center; border-bottom: 1px solid #17171A; color: #8E8E96; font-size: 11px; letter-spacing: .08em">

          </div>
          <span style="width: 68px; text-align: center">WATCH</span>
        </div>
        <sc-for list="{{ rows }}" as="r" hint-placeholder-count="14">

            <a href="{{ r.href }}" aria-label="{{ r.aria }}" style="flex: 1; display: grid; grid-template-columns: 56px minmax(0, 2.6fr) 120px minmax(0, 1fr) 96px 96px 96px minmax(0, 1.1fr); align-items: center; padding: 12px 0 12px 20px; font-size: 14px">

                <sc-if value="{{ r.ini }}" hint-placeholder-val="{{ false }}"><span style="width: 30px; height: 30px; border-radius: 50%; flex: none; background: #26262B; display: grid; place-items: center; font-size: 11px; font-weight: 700">{{ r.ini }}</span></sc-if>
                <span style="min-width: 0"><span style="display: block; font-weight: 700; font-size: 15px">{{ r.n }}</span><span style="display: block; font-size: 12px; color: #8E8E96; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ r.sub }}</span></span>

              <span><span style="padding: 4px 8px; border-radius: 6px; font-size: 12px; font-weight: 600; background: {{ r.tbg }}; color: {{ r.tfg }}">{{ r.type }}</span></span>
              <span style="text-align: right; font-weight: 700">{{ r.px }}</span>
              <span style="text-align: right; color: {{ r.c1 }}">{{ r.d1 }}</span>
              <span style="text-align: right; color: {{ r.c7 }}">{{ r.d7 }}</span>
              <span style="text-align: right; color: {{ r.c30 }}">{{ r.d30 }}</span>
              <span style="text-align: right; padding-right: 8px; color: #B4B4BB">{{ r.vol }}</span>
            </a>
            <span style="width: 68px; display: grid; place-items: center">
              <button type="button" onClick="{{ r.star }}" aria-pressed="{{ r.on }}" aria-label="{{ r.starLabel }}" style="width: 40px; height: 40px; border: 0; border-radius: 10px; background: transparent; display: grid; place-items: center">
                <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.2l2.7 5.6 6.1.8-4.5 4.2 1.1 6.1L12 17l-5.4 2.9 1.1-6.1-4.5-4.2 6.1-.8z" fill="{{ r.sfill }}" stroke="{{ r.sline }}" stroke-width="1.7" stroke-linejoin="round"></path></svg>
              </button>
            </span>
          </div>
        </sc-for>
      </div>
    </div>
  </section>
</div>
<div aria-hidden="true" style="height: 92px"></div>
<dc-import name="AskWidget" start-open="{{ no }}" hint-size="60px,60px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1900}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { filter: 'All', watch: { TBB: true, CHIP: true, NVDA: true, AVAX: true, FPT: true } }; }
  renderVals() {
    const L = {

      META: '/_blob/7cb6699a9967d375d78dd56337513776', TSLA: '/_blob/d842e3b1477d3ba9702e7f0b73555cf7', JOE: '/_blob/750e8d80562291d062e695645b5b423f',
      FPT: '/_blob/e3f1c11249881fd23b4e8f00dc924a42', VCB: '/_blob/523fb233a3ec4e2510ac884e3c071124', HPG: '/_blob/18d7c34d7f599b98be5e7159aea28b54',
      sAVAX: '/_blob/76b37006a9b6817db9fd6318f2130c4d', 'LINK.e': '/_blob/6203752053b9a93e106bd555323359c4', XAUt0: '/_blob/c487f04d592283f8f54d50aa759bd224'
    };
    const half = 'linear-gradient(90deg, #F2F2F3 50%, #9052F9 50%)';
    const T = {
      Index: { tbg: '#221637', tfg: '#B18CFB', dot: '#F5B14C', src: 'Fuji · ✓ IndexLens', href: 'Index.dc.html' },
      Stock: { tbg: '#1C1C20', tfg: '#B4B4BB', dot: '#4C8DFF', src: 'On-chain stock', href: 'Stock.dc.html' },

      Token: { tbg: '#1C1C20', tfg: '#B4B4BB', dot: '#E84142', src: 'Avalanche C-Chain', href: 'Token.dc.html' }
    };
    const D = [
      ['Index', 'TBB', 'Tech + BTC Balanced', 'TBB · 5 assets · Manual', '107.02', 1.34, 9.26, 5.59, '$180K', half],

      ['VN Stock', 'FPT', 'FPT', 'FPT Corporation · HOSE', '96,500 ₫', 1.6, 3.4, 7.9, '412.6B ₫'],
      ['VN Stock', 'VCB', 'VCB', 'Vietcombank · HOSE', '63,800 ₫', 0.5, 1.2, 2.6, '298.1B ₫'],
      ['VN Stock', 'HPG', 'HPG', 'Hoa Phat Group · HOSE', '27,450 ₫', -0.9, -2.1, 1.4, '655.0B ₫'],
      ['VN Stock', 'MWG', 'MWG', 'Mobile World · HOSE', '71,200 ₫', 0.8, 2.7, 5.1, '231.4B ₫'],
      ['VN Stock', 'VHM', 'VHM', 'Vinhomes · HOSE', '58,900 ₫', -1.3, -0.6, -3.2, '377.9B ₫'],
      ['Token', 'AVAX', 'AVAX', 'Avalanche', '$6.51', 2.1, 4.8, -2.1, '$84.2M'],
      ['Token', 'BTC.b', 'BTC.b', 'Bitcoin', '$74,357', 0.7, 2.2, 3.8, '$31.5M'],

      ['Token', 'sAVAX', 'sAVAX', 'Staked AVAX', '$7.84', 1.9, 4.5, -1.4, '$9.4M'],

      ['Token', 'XAUt0', 'XAUt0', 'Tether Gold', '$3,972', 0.3, 1.0, 2.9, '$1.1M']
    ];
    let dp = 2;
    const pct = (v) => (v >= 0 ? '+' : '') + v.toFixed(dp) + '%';
    const col = (v) => (v >= 0 ? '#3DD68C' : '#FF6B6B');
    const s = this.state;
    const F = { All: () => true, Watchlist: (d) => !!s.watch[d[1]], Indexes: (d) => d[0] === 'Index', Stocks: (d) => d[0] === 'Stock', 'VN Stocks': (d) => d[0] === 'VN Stock', Tokens: (d) => d[0] === 'Token' };
    const rows = D.filter(F[s.filter]).map((d, i) => {

      return {

      pick: () => this.setState({ filter: k })

    const spark = (seed, up) => {
      let h = seed; const r = () => { h = (h * 16807) % 2147483647; return (h - 1) / 2147483646; };
      const v = []; let x = 0; for (let i = 0; i < 24; i++) { x += (r() - 0.45) * 1.2 + up / 24; v.push(x); }

</script>
