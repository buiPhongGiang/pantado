name: contracts

on:
  push:
    branches: [main]
  pull_request:

jobs:
  forge-test:
    name: Foundry build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1

      - name: Build
        run: forge build

      - name: Test (unit + invariants; mainnet-fork tests run when AVALANCHE_FORK_RPC is set)
        run: forge test -vv
